name: Build and release (Windows portable + macOS dmg)

# Builds PdfCraft and publishes a GitHub Release with:
#   pdfcraft-<version>-windows-x64-portable.zip   pdfcraft.exe, pdfcraft-cli.exe, the OCR models/ folder and
#                                                 LICENSE (no installer; just unzip and run)
#   pdfcraft-<version>-macos-aarch64.dmg          Apple Silicon app with the OCR models inside, UNSIGNED
#                                                 (right-click > Open the first time)
#   pdfcraft-cli-<version>-macos-aarch64.zip      the command-line tool for macOS
#   SHA256SUMS.txt                                checksums of the files above
# Nothing here needs an Apple account or any secret beyond the automatic GITHUB_TOKEN.
#
# How to run it (it never starts by itself on a plain push):
#   * Publish a release: push a tag such as v0.21.1, or Actions > Run workflow and fill in `tag`.
#   * Build only, no release: Actions > Run workflow with `tag` empty. The files are then attached
#     to the run as artifacts.
#
# Private repository: Windows minutes count 2x and macOS minutes 10x against the free quota.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.21.1 (empty: build only, no release)"
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          # The version lives in one place: [workspace.package] version in the root Cargo.toml.
          version="$(awk '/^\[/ { in_pkg = ($0 == "[workspace.package]"); next } in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)"
          [ -n "$version" ] || { echo "could not read the version from Cargo.toml" >&2; exit 1; }
          tag=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_TAG}" ]; then tag="${INPUT_TAG}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version $version, release tag: ${tag:-none (build only)}"
        env:
          INPUT_TAG: ${{ inputs.tag }}

  windows:
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x64-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-x64-

      - name: Build (the app and the command-line tool)
        shell: pwsh
        run: cargo build --release --locked -p pdfcraft -p pdfcraft-cli

      - name: Portable zip
        shell: pwsh
        run: |
          $name = "pdfcraft-${{ needs.meta.outputs.version }}-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/pdfcraft.exe "dist/$name/"
          Copy-Item target/release/pdfcraft-cli.exe "dist/$name/"
          Copy-Item LICENSE "dist/$name/"
          # The OCR models Scan & OCR needs (CC-BY-SA-4.0; each comes with its licence file and an
          # ATTRIBUTION.txt). The app and the CLI both look in a models/ folder beside the exe.
          cargo run -p xtask -- models "dist/$name/models"
          if ($LASTEXITCODE -ne 0) { throw "fetching the OCR models failed" }
          Get-ChildItem "dist/$name/models" -Filter *.part | Remove-Item -Force
          $found = @(Get-ChildItem "dist/$name/models" -File | Where-Object { $_.Name -notmatch 'LICENCE|ATTRIBUTION' })
          if ($found.Count -lt 2) { throw "expected the OCR model files in models/, found $($found.Count)" }
          Get-ChildItem "dist/$name" -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -Force
          Get-Item "dist/$name.zip" | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-windows-x64-portable
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: meta
    # Apple Silicon. macos-14 was retired by GitHub on 2026-11-02, so this is macos-15.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin
          rustc --version
          cargo --version

      - name: Cache dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-arm64-

      # packaging/macos/package.sh copies NOTICE into the app. The repository keeps a single LICENSE
      # file, so the notice here is that licence text, without the third-party notices a public
      # release would need.
      - name: NOTICE for the app bundle
        run: cp LICENSE NOTICE

      - name: Build and package (unsigned)
        run: bash packaging/macos/package.sh --arch aarch64

      - name: List the artifacts
        run: ls -la dist/release

      - uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-macos-arm64-unsigned
          path: |
            dist/release/*.dmg
            dist/release/pdfcraft-cli-*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    # Only when there is a tag to publish.
    if: ${{ needs.meta.outputs.tag != '' }}
    needs: [meta, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Checksums
        run: |
          cd files
          ls -la
          sha256sum *.zip *.dmg | tee SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A release for this tag exists (re-run): replace its files.
            gh release upload "$TAG" files/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" files/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PdfCraft $VERSION" \
              --notes "Windows 64-bit portable zip (unzip and run pdfcraft.exe; it holds the command-line tool pdfcraft-cli.exe and the OCR models too), an unsigned macOS Apple Silicon disk image (right-click > Open the first time; the OCR models are inside), and the macOS command-line tool. Checksums are in SHA256SUMS.txt." \
              $flags
          fi
